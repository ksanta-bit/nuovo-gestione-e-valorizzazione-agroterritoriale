<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mappa interattiva - Alpicoltura</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f7f8fa, #12161b);
      --surface: light-dark(#ffffff, #1b222a);
      --surface-soft: light-dark(#f0f3f6, #222b35);
      --text: light-dark(#1c2732, #edf2f7);
      --muted: light-dark(#607080, #a9b6c3);
      --line: light-dark(#d4dce4, #3a4652);
      --root: light-dark(#1f3c4d, #d7e8f2);
      --root-text: light-dark(#ffffff, #14242f);
      --shadow: 0 10px 28px light-dark(rgba(29, 46, 61, .10), rgba(0, 0, 0, .28));
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    button { font: inherit; }

    .page {
      width: min(1800px, calc(100% - clamp(28px, 4vw, 72px)));
      margin: 0 auto;
      padding: 26px 0 64px;
      font-size: 19px;
    }

    .site-nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    .site-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); font-size: .92rem; font-weight: 650; text-decoration: none; }
    .site-nav a:hover { background: var(--surface-soft); }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .heading h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3.4vw, 2.5rem);
      line-height: 1.12;
      font-weight: 700;
    }

    .heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .toolbar button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      background: var(--surface);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
    }

    .toolbar button:hover { background: var(--surface-soft); }
    .toolbar button:focus-visible { outline: 3px solid light-dark(#7aa7c2, #8fc0dc); outline-offset: 2px; }

    .root-node {
      position: relative;
      max-width: 760px;
      margin: 0 auto 42px;
      padding: 21px 26px;
      border-radius: var(--radius);
      background: var(--root);
      color: var(--root-text);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .root-node strong {
      display: block;
      font-size: clamp(1.15rem, 2.5vw, 1.55rem);
      line-height: 1.25;
    }

    .root-node span {
      display: block;
      margin-top: 7px;
      font-size: .93rem;
      line-height: 1.45;
      opacity: .9;
    }

    .root-node::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -42px;
      width: 2px;
      height: 42px;
      background: var(--line);
    }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr));
      gap: 16px;
      align-items: start;
    }

    .branch {
      --branch: #4b7792;
      --branch-soft: color-mix(in srgb, var(--branch) 14%, var(--surface));
      position: relative;
      border: 1px solid var(--line);
      border-top: 5px solid var(--branch);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .branch[data-tone="red"] { --branch: #b24a4a; }
    .branch[data-tone="green"] { --branch: #3d7f56; }
    .branch[data-tone="blue"] { --branch: #356f9d; }
    .branch[data-tone="amber"] { --branch: #a86f19; }
    .branch[data-tone="violet"] { --branch: #7058a6; }
    .branch[data-tone="teal"] { --branch: #2f7b79; }

    .branch-toggle,
    .concept-toggle {
      width: 100%;
      border: 0;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .branch-toggle {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 10px;
      min-height: 66px;
      padding: 12px 14px;
      background: var(--branch-soft);
    }

    .branch-toggle:hover,
    .concept-toggle:hover { filter: brightness(.98); }

    .branch-toggle:focus-visible,
    .concept-toggle:focus-visible {
      outline: 3px solid var(--branch);
      outline-offset: -3px;
    }

    .number {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--branch);
      color: #fff;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .branch-title {
      min-width: 0;
      font-size: 1.02rem;
      font-weight: 750;
      line-height: 1.25;
    }

    .symbol {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: var(--branch);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
    }

    [aria-expanded="true"] .symbol { transform: rotate(45deg); }

    .branch-content {
      padding: 14px 16px 18px 25px;
    }

    .branch-content[hidden],
    .node-children[hidden] { display: none; }

    .tree-node {
      position: relative;
      margin: 0 0 10px 17px;
    }

    .tree-node:last-child { margin-bottom: 0; }

    .tree-node::before {
      content: "";
      position: absolute;
      left: -17px;
      top: 20px;
      width: 14px;
      height: 2px;
      background: color-mix(in srgb, var(--branch) 55%, var(--line));
    }

    .tree-node::after {
      content: "";
      position: absolute;
      left: -17px;
      top: -11px;
      bottom: -12px;
      width: 2px;
      background: color-mix(in srgb, var(--branch) 55%, var(--line));
    }

    .tree-node:last-child::after { bottom: calc(100% - 21px); }

    .concept-toggle {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 26px;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px 10px 8px 12px;
      border-radius: 6px;
      background: var(--surface-soft);
      font-weight: 700;
      line-height: 1.3;
    }

    .concept-toggle .symbol {
      width: 24px;
      height: 24px;
      font-size: 1.1rem;
    }

    .leaf {
      position: relative;
      min-height: 52px;
      padding: 10px 12px 10px 17px;
      border-left: 4px solid color-mix(in srgb, var(--branch) 70%, transparent);
      background: color-mix(in srgb, var(--branch) 7%, var(--surface));
      border-radius: 0 6px 6px 0;
      line-height: 1.35;
    }

    .leaf strong {
      display: block;
      font-size: .94rem;
      font-weight: 720;
    }

    .leaf span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.45;
    }

    .node-children {
      margin: 8px 0 0 13px;
      padding-left: 9px;
      border-left: 2px solid color-mix(in srgb, var(--branch) 30%, var(--line));
    }

    .status {
      min-height: 20px;
      margin: 16px 2px 0;
      color: var(--muted);
      font-size: .85rem;
      text-align: right;
    }

     @media (max-width: 1100px) { .page { font-size: 17px; } .map-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); } }

     @media (max-width: 760px) { .page { font-size: 16px; }
      .page { width: min(100% - 20px, 680px); padding-top: 20px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .toolbar button { flex: 1 1 auto; }
      .map-grid { grid-template-columns: 1fr; }
      .root-node { margin-bottom: 32px; }
      .root-node::after { height: 32px; bottom: -32px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .symbol { transition: transform 160ms ease; }
      .branch, .leaf, .concept-toggle { transition: background-color 160ms ease, border-color 160ms ease; }
    }

    @media print {
      :root { color-scheme: light; }
      body { background: #fff; }
      .page { width: 100%; padding: 0; }
      .toolbar, .status { display: none; }
      .branch { break-inside: avoid; box-shadow: none; }
      .map-grid { gap: 10px; }
    }
  </style>
</head>

    const elaborations = {};

    const map = document.getElementById("map");
    const status = document.getElementById("status");
    const storageKey = "mappa-alpicoltura";

    function childId(parentId, index, item) {
      const slug = item.id || item.title.toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      return `${parentId}-${index}-${slug}`;
    }

    function makeLeaf(item) {
      const leaf = document.createElement("div");
      leaf.className = "leaf";

      const title = document.createElement("strong");
      title.textContent = item.title;
      leaf.appendChild(title);

      if (item.note) {
        const note = document.createElement("span");
        note.textContent = `${item.note}${elaborations[item.title] ? ` ${elaborations[item.title]}` : ""}`;
        leaf.appendChild(note);
      }

      return leaf;
    }

    function makeTreeNode(item, id) {
      const wrapper = document.createElement("div");
      wrapper.className = "tree-node";

      if (!item.children) {
        wrapper.appendChild(makeLeaf(item));
        return wrapper;
      }

      const button = document.createElement("button");
      button.type = "button";
      button.className = "concept-toggle";
      button.dataset.nodeId = id;
      button.setAttribute("aria-expanded", "false");

      const label = document.createElement("span");
      label.textContent = item.title;
      const symbol = document.createElement("span");
      symbol.className = "symbol";
      symbol.setAttribute("aria-hidden", "true");
      symbol.textContent = "+";
      button.append(label, symbol);

      const children = document.createElement("div");
      children.className = "node-children";
      children.hidden = true;
      children.id = `${id}-children`;
      button.setAttribute("aria-controls", children.id);

      item.children.forEach((child, index) => {
        children.appendChild(makeTreeNode(child, childId(id, index, child)));
      });

      button.addEventListener("click", () => toggle(button, children));
      wrapper.append(button, children);
      return wrapper;
    }

    function makeBranch(branch, index) {
      const section = document.createElement("section");
      section.className = "branch";
      section.dataset.tone = branch.tone;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "branch-toggle";
      button.dataset.nodeId = branch.id;
      button.setAttribute("aria-expanded", "false");

      const number = document.createElement("span");
      number.className = "number";
      number.textContent = index + 1;
      const title = document.createElement("span");
      title.className = "branch-title";
      title.textContent = branch.title;
      const symbol = document.createElement("span");
      symbol.className = "symbol";
      symbol.setAttribute("aria-hidden", "true");
      symbol.textContent = "+";
      button.append(number, title, symbol);

      const content = document.createElement("div");
      content.className = "branch-content";
      content.hidden = true;
      content.id = `${branch.id}-content`;
      button.setAttribute("aria-controls", content.id);

      branch.children.forEach((child, childIndex) => {
        content.appendChild(makeTreeNode(child, childId(branch.id, childIndex, child)));
      });

      button.addEventListener("click", () => toggle(button, content));
      section.append(button, content);
      return section;
    }

    function toggle(button, content, persist = true) {
      const expanded = button.getAttribute("aria-expanded") === "true";
      button.setAttribute("aria-expanded", String(!expanded));
      content.hidden = expanded;
      if (persist) saveState();
      updateStatus();
    }

    function setAll(expanded) {
      document.querySelectorAll("[data-node-id]").forEach(button => {
        const controlled = document.getElementById(button.getAttribute("aria-controls"));
        button.setAttribute("aria-expanded", String(expanded));
        if (controlled) controlled.hidden = !expanded;
      });
      saveState();
      updateStatus();
    }

    function saveState() {
      const open = [...document.querySelectorAll('[data-node-id][aria-expanded="true"]')]
        .map(button => button.dataset.nodeId);
      try { localStorage.setItem(storageKey, JSON.stringify(open)); }
      catch { /* La mappa resta utilizzabile anche se il browser blocca lo storage locale. */ }
    }

    function restoreState() {
      let open = [];
      try { open = JSON.parse(localStorage.getItem(storageKey) || "[]"); }
      catch { open = []; }

      open.forEach(id => {
        const button = document.querySelector(`[data-node-id="${CSS.escape(id)}"]`);
        if (!button) return;
        const controlled = document.getElementById(button.getAttribute("aria-controls"));
        button.setAttribute("aria-expanded", "true");
        if (controlled) controlled.hidden = false;
      });
    }

    function updateStatus() {
      const count = document.querySelectorAll('[data-node-id][aria-expanded="true"]').length;
      status.textContent = count === 0 ? "Mappa chiusa" : `${count} nodi aperti`;
    }

    branches.forEach((branch, index) => map.appendChild(makeBranch(branch, index)));
    restoreState();
    updateStatus();

    document.getElementById("open-all").addEventListener("click", () => setAll(true));
    document.getElementById("close-all").addEventListener("click", () => setAll(false));
    document.getElementById("print-map").addEventListener("click", () => window.print());
  </script>
